name: pr-agent

# Déclenché à l'ouverture et à la réouverture d'une PR — volontairement pas
# sur chaque push (synchronize), pour ne pas regénérer le résumé à chaque
# commit pendant qu'une PR est encore en cours d'écriture.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    steps:
      - name: PR-Agent — résumé, type, effort de revue, diagramme
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          GEMINI_API_KEY: ${{ secrets.GROQ_API_KEY }}
